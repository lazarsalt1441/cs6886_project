name: Reproducibility checks
on: [push, pull_request, workflow_dispatch]
jobs:
  cpu:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.3.5 iree-base-compiler==3.13.0 iree-base-runtime==3.13.0
      - run: python scripts/check_submission.py
      - run: python -m unittest discover -s dram/tests -v
      - run: python dram/tests/cpu_integration.py --cache local_validation --compiler iree-compile
      - run: python scripts/unpack_artifacts.py
      - run: python scripts/reproduce_results.py
